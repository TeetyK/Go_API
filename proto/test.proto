syntax = "proto3";

option go_package = "./proto";

// The notification service definition.
service NotificationService {
  // Sends an email
  rpc SendEmail (EmailRequest) returns (EmailReply);
}

// The request message containing the email details.
message EmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
}

// The response message confirming the email was sent.
message EmailReply {
  bool success = 1;
  string message = 2;
}
